name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend:
    name: Backend + PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: robot
          POSTGRES_PASSWORD: robot
          POSTGRES_DB: robot_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robot -d robot_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://robot:robot@localhost:5432/robot_eval
      ROBOT_DATA_ROOT: data/episodes

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile Python modules
        run: python -m compileall backend robot scripts

      - name: Seed demo data into PostgreSQL
        run: python scripts/seed_demo_data.py

      - name: Verify DataLoader example
        run: python scripts/dataloader_example.py --root data/episodes --batch-size 2

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build
